function lsGet(k,d){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}}

function claimDailyReward(){const info=checkDailyReward();if(!info)return 0;lsSet(DAILY_KEY,{lastDate:todayStr(),day:info.day});const sk=getStreak(),today=todayStr();const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const newCount=sk.lastDate===yesterday.toISOString().slice(0,10)?sk.count+1:1;lsSet(STREAK_KEY,{count:newCount,lastDate:today});return info.coins;}

const Audio={
 ctx:null,mg:null,bgOscs:[],muted:false,unlocked:false,
 _create(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});this.mg=this.ctx.createGain();this.mg.gain.value=0.38;this.mg.connect(this.ctx.destination);}catch(e){}},

 tone(f,d,type,vol){if(this.muted||!this.ctx)return;if(this.ctx.state!=='running'){this.ctx.resume().catch(()=>{});return;}try{type=type||'sine';vol=vol||0.18;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.mg);o.type=type;o.frequency.value=f;const now=this.ctx.currentTime;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(0.0001,now+d);o.start(now);o.stop(now+d+0.05);}catch(e){}},

 _doBgm(){if(this.bgOscs.length>0)return;try{[130.81,164.81,196,246.94].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.mg);o.type='sine';o.frequency.value=f;g.gain.value=0.016;o.start(this.ctx.currentTime+i*0.4);this.bgOscs.push(o);});}catch(e){}},

function genLevel(lv){
 const{colors}=levelCfg(lv);const pal=PALETTE.slice(0,colors);const pool=[];
 for(let i=0;i<colors;i++)for(let j=0;j<BALLS;j++)pool.push(i);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const tubes=[];
 for(let i=0;i<colors;i++)tubes.push({blocks:[...pool.slice(i*BALLS,(i+1)*BALLS)],x:0,y:0,w:0,h:0,idx:i});
 for(let i=0;i<EMPTY;i++)tubes.push({blocks:[],x:0,y:0,w:0,h:0,idx:colors+i});
 return{tubes,palette:pal};
}
function isSolved(tubes){return tubes.every(tb=>tb.blocks.length===0||(tb.blocks.length===BALLS&&tb.blocks.every(b=>b===tb.blocks[0])));}
function canMove(from,to){if(from.blocks.length===0||to.blocks.length>=BALLS)return false;if(to.blocks.length===0)return true;return to.blocks[to.blocks.length-1]===from.blocks[from.blocks.length-1];}
function hasAnyMove(tubes){const n=tubes.length;for(let i=0;i<n;i++){const from=tubes[i];if(from.blocks.length===0)continue;if(from.blocks.length===BALLS&&from.blocks.every(b=>b===from.blocks[0]))continue;const top=from.blocks[from.blocks.length-1];for(let j=0;j<n;j++){if(i===j)continue;const to=tubes[j];if(to.blocks.length>=BALLS)continue;if(to.blocks.length===0){if(from.blocks.length>0&&!(from.blocks.every(b=>b===from.blocks[0])))return true;}else{const toTop=to.blocks[to.blocks.length-1];if(toTop===top)return true;}}}return false;}

function findHint(){
 for(let i=0;i<G.tubes.length;i++){
 const from=G.tubes[i];if(from.blocks.length===0)continue;
 const top=from.blocks[from.blocks.length-1];
 for(let j=0;j<G.tubes.length;j++){
 if(i===j)continue;
 const to=G.tubes[j];
 if(canMove(from,to)&&to.blocks.length>0&&to.blocks[to.blocks.length-1]===top)return i;
 }
 }
 for(let i=0;i<G.tubes.length;i++){
 const from=G.tubes[i];if(from.blocks.length===0)continue;
 for(let j=0;j<G.tubes.length;j++){
 if(i===j)continue;
 if(canMove(from,G.tubes[j]))return i;
 }
 }
 return -1;
}

function layoutTubes(){
 const n=G.tubes.length,bot=G.safeBottom+16,avH=G.H-G.tubeY-bot;
 const rows=n>7?2:1;const perRow=Math.ceil(n/rows);
 const tw=Math.round(Math.min(64,Math.max(36,(G.W-16)/perRow-8)));
 const rowH=rows===2?Math.round((avH-12)/2):avH;
 const th=Math.round(Math.min(rowH*0.94,tw*4.8));
 G.tubes.forEach((tb,i)=>{
 const row=rows===2?Math.floor(i/perRow):0;const col=rows===2?i%perRow:i;
 const countInRow=rows===2&&row===1?n-perRow:perRow;
 const total=countInRow*tw+(countInRow-1)*8;const ox=Math.round((G.W-total)/2);
 tb.w=tw;tb.h=th;tb.x=ox+col*(tw+8);tb.y=G.tubeY+row*(th+12)+Math.round((rowH-th)/2);
 });
}

function rRect(c,x,y,w,h,r){const[tl,tr,br,bl]=typeof r==='number'?[r,r,r,r]:r;c.beginPath();c.moveTo(x+tl,y);c.lineTo(x+w-tr,y);c.quadraticCurveTo(x+w,y,x+w,y+tr);c.lineTo(x+w,y+h-br);c.quadraticCurveTo(x+w,y+h,x+w-br,y+h);c.lineTo(x+bl,y+h);c.quadraticCurveTo(x,y+h,x,y+h-bl);c.lineTo(x,y+tl);c.quadraticCurveTo(x,y,x+tl,y);c.closePath();}
function cLight(h,a){const n=parseInt(h.slice(1),16);return'rgb('+Math.min(255,(n>>16&255)+Math.round(255*a))+','+Math.min(255,(n>>8&255)+Math.round(255*a))+','+Math.min(255,(n&255)+Math.round(255*a))+')';}
function cDark(h,a){const n=parseInt(h.slice(1),16);return'rgb('+Math.max(0,(n>>16&255)-Math.round(255*a))+','+Math.max(0,(n>>8&255)-Math.round(255*a))+','+Math.max(0,(n&255)-Math.round(255*a))+')';}

function drawBall(c,cx,cy,r,col){
 const g=c.createRadialGradient(cx-r*0.32,cy-r*0.35,r*0.05,cx,cy,r);
 g.addColorStop(0,cLight(col,0.55));g.addColorStop(0.45,col);g.addColorStop(0.85,cDark(col,0.22));g.addColorStop(1,cDark(col,0.4));
 c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fillStyle=g;c.fill();
 c.beginPath();c.arc(cx-r*0.28,cy-r*0.3,r*0.26,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.52)';c.fill();
 c.beginPath();c.arc(cx+r*0.2,cy+r*0.22,r*0.1,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.2)';c.fill();
}

function drawTube(c,tb,sel,done,isHint,animT){
 const lift=sel?-12:0,R=13,{x,y,w,h}=tb;
 c.save();c.translate(0,lift);
 if(sel||done||isHint){
 c.shadowBlur=isHint?32:sel?28:18;
 c.shadowColor=isHint?'rgba(255,220,0,0.95)':sel?'rgba(0,229,255,0.9)':'rgba(68,255,136,0.8)';
 }
 rRect(c,x,y,w,h,R);
 const bodyG=c.createLinearGradient(x,y,x+w,y);
 if(isHint){bodyG.addColorStop(0,'rgba(60,45,0,0.92)');bodyG.addColorStop(1,'rgba(40,30,0,0.92)');}
 else if(sel){bodyG.addColorStop(0,'rgba(0,40,80,0.92)');bodyG.addColorStop(1,'rgba(0,20,60,0.92)');}
 else if(done){bodyG.addColorStop(0,'rgba(0,50,30,0.85)');bodyG.addColorStop(1,'rgba(0,30,20,0.85)');}
 else{bodyG.addColorStop(0,'rgba(20,30,70,0.78)');bodyG.addColorStop(1,'rgba(8,15,50,0.78)');}
 c.fillStyle=bodyG;c.fill();c.shadowBlur=0;
 rRect(c,x,y,w,h,R);
 const borderG=c.createLinearGradient(x,y,x,y+h);
 if(isHint){borderG.addColorStop(0,'rgba(255,220,0,1)');borderG.addColorStop(0.5,'rgba(255,180,0,0.7)');borderG.addColorStop(1,'rgba(255,220,0,0.5)');}
 else if(sel){borderG.addColorStop(0,'rgba(0,229,255,1)');borderG.addColorStop(0.5,'rgba(0,150,255,0.7)');borderG.addColorStop(1,'rgba(0,229,255,0.5)');}
 else if(done){borderG.addColorStop(0,'rgba(68,255,136,0.95)');borderG.addColorStop(0.5,'rgba(34,197,94,0.6)');borderG.addColorStop(1,'rgba(68,255,136,0.4)');}
 else{borderG.addColorStop(0,'rgba(180,210,255,0.35)');borderG.addColorStop(1,'rgba(100,140,220,0.12)');}
 c.strokeStyle=borderG;c.lineWidth=isHint?3:sel?2.5:1.8;c.stroke();
 const gl=c.createLinearGradient(x,y,x+w*0.4,y);gl.addColorStop(0,'rgba(255,255,255,0.22)');gl.addColorStop(1,'rgba(255,255,255,0)');
 rRect(c,x,y,w*0.4,h,[R,0,0,R]);c.fillStyle=gl;c.fill();
 c.save();rRect(c,x+2,y+2,w-4,h-4,R-2);c.clip();
 const bw=w-10,br2=bw/2,bs=Math.min(bw+3,(h-14)/BALLS);
 tb.blocks.forEach((ci,bi)=>{drawBall(c,x+w/2,y+h-9-bi*bs-br2,br2,G.palette[ci]||PALETTE[ci]||'#888');});
 c.restore();
 if(isHint){
 const pulse=Math.sin(animT*6)*0.4+0.6;
 c.globalAlpha=pulse;c.font='bold '+(w*0.5)+'px sans-serif';c.fillStyle='#ffd700';c.textAlign='center';c.fillText('💡',x+w/2,y-4);c.globalAlpha=1;
 }
 c.restore();
}

function drawScene(){
 const{ctx:c,W,H,animT,phase,tubes,selected}=G;
 c.clearRect(0,0,W,H);
 const bg=c.createLinearGradient(0,0,W*0.3,H);bg.addColorStop(0,'#070918');bg.addColorStop(0.5,'#0a1228');bg.addColorStop(1,'#060d20');
 c.fillStyle=bg;c.fillRect(0,0,W,H);
 const orbs=[{x:W*0.15,y:H*0.12,r:60,col:'rgba(77,208,255,0.06)'},{x:W*0.85,y:H*0.08,r:80,col:'rgba(123,47,255,0.07)'},{x:W*0.5,y:H*0.85,r:100,col:'rgba(255,51,102,0.04)'},{x:W*0.08,y:H*0.6,r:55,col:'rgba(34,197,94,0.05)'},{x:W*0.92,y:H*0.55,r:65,col:'rgba(249,115,22,0.05)'}];
 orbs.forEach(o=>{const r=o.r*(1+Math.sin(animT*0.4)*0.12);const g=c.createRadialGradient(o.x,o.y,0,o.x,o.y,r);g.addColorStop(0,o.col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(o.x,o.y,r,0,Math.PI*2);c.fill();});
 for(let i=0;i<8;i++){const px=W*((i*0.137+animT*0.015)%1);const py=H*((i*0.211+animT*0.008)%1);c.beginPath();c.arc(px,py,1.2,0,Math.PI*2);c.fillStyle='rgba(150,200,255,'+(0.08+Math.sin(animT+i)*0.05)+')';c.fill();}
 if(phase==='playing'||phase==='win'||phase==='over'){
 tubes.forEach((tb)=>{
 const done=tb.blocks.length===BALLS&&tb.blocks.every(b=>b===tb.blocks[0]);
 drawTube(c,tb,selected===tb.idx,done,G.hintTube===tb.idx,animT);
 });
 G.particles=G.particles.filter(p=>p.life>0);
 G.particles.forEach(p=>{c.globalAlpha=p.life;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fillStyle=p.col;c.fill();});
 c.globalAlpha=1;
 }
}
function spawnParticles(x,y,col){for(let i=0;i<16;i++){const a=i/16*Math.PI*2,s=2+Math.random()*5;G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,r:3+Math.random()*5,col,life:1});}}
function gameLoop(ts){G.rafId=requestAnimationFrame(gameLoop);const dt=Math.min((ts-G.lastTime)/1000,0.1);G.lastTime=ts;G.animT+=dt;G.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life=Math.max(0,p.life-0.025);});drawScene();}

function maybeInterstitial(cb){
 if(isAdFree()||G.level%5!==0){cb();return;}
 G.afterInterstitial=cb;G.phase='interstitial';stopTimer();document.getElementById('hud').style.display='none';
 let s=5;
 showOv('rgba(0,0,0,0.97)','<div style="text-align:center;padding:30px 20px;max-width:320px;width:92%;"><div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:8px;">'+i18n('ititle')+'</div><div style="width:100%;height:90px;background:linear-gradient(135deg,#7b2fff22,#00e5ff22);border:1px solid rgba(77,208,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:12px 0;color:#88aaff;font-size:12px;">'+i18n('adBanner')+'</div><button id="its-skip" class="btn btn-ghost" disabled style="opacity:0.4;font-size:13px;">'+i18n('iskip')+' (<span id="its-cnt">5</span>s)</button></div>');
 const iv=setInterval(()=>{s--;const el=document.getElementById('its-cnt');if(el)el.textContent=s;if(s<=0){clearInterval(iv);const btn=document.getElementById('its-skip');if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent=i18n('iskip');}}},1000);
 document.getElementById('its-skip').onclick=()=>{if(!document.getElementById('its-skip').disabled){clearInterval(iv);hideOv();if(G.afterInterstitial)G.afterInterstitial();}};
}

function showWin(){
 G.phase='win';stopTimer();
 const streakMult=getStreakBonus();
 const base=G.level*20;
 const bonus=base;
 const coinsEarned=5;
 G.score+=bonus;G.coins+=coinsEarned;addLB(G.score,G.level);saveGame();Audio.win();
 const streakTxt=streakMult>1?'<div style="color:#ff8844;font-size:12px;margin-bottom:4px;">🔥 '+i18n('streak')+' bonus x'+streakMult+'!</div>':'';
 showOv('rgba(0,12,5,0.92)','<div style="text-align:center;padding:22px 18px;max-width:300px;width:92%;"><div style="font-size:clamp(18px,6vw,36px);font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#ffcc00,#44ff88,#4dd0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">'+i18n('win')+'</div>'+streakTxt+'<div style="color:#88ddaa;font-size:14px;margin:4px 0 18px;">+'+bonus+' '+i18n('score')+' · 🪙+'+coinsEarned+'</div><button id="win-next" class="btn btn-green" style="font-size:15px;padding:14px 40px;width:100%;">'+i18n('next')+'</button></div>');
 document.getElementById('win-next').onclick=()=>{G.level++;maybeInterstitial(()=>startLevel());};
}

function showStuck(){
 if(G.phase==='over')return;G.phase='over';stopTimer();Audio.fail();
 showOv('rgba(14,3,3,0.94)','<div style="text-align:center;padding:22px 18px;max-width:310px;width:92%;"><div style="font-size:clamp(16px,5vw,28px);font-weight:900;color:#ff8800;margin-bottom:8px;">'+i18n('stuckTitle')+'</div><div style="color:#884422;font-size:12px;margin-bottom:16px;">'+i18n('stuckSub')+'</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"><button id="sk-undo" class="btn btn-gold" style="font-size:13px;padding:11px;width:100%;min-height:44px;">'+i18n('undo2')+'</button><button id="sk-tube" class="btn btn-primary" style="font-size:13px;padding:11px;width:100%;min-height:44px;">'+i18n('extraTubeCost')+'</button><button id="sk-ad" class="btn" style="background:rgba(77,208,255,0.12);border:1px solid rgba(77,208,255,0.3);font-size:13px;padding:11px;width:100%;min-height:44px;">'+i18n('watchad')+'</button></div><button id="sk-retry" class="btn btn-ghost" style="font-size:13px;padding:10px;min-height:44px;width:100%;">'+i18n('restart')+'</button></div>');
 document.getElementById('sk-undo').onclick=()=>{if(G.coins>=200&&G.history.length>=2){G.coins-=200;undoMove();undoMove();saveGame();resumePlay();}else if(G.coins<200){flash(i18n('noCoins'));}else{flash(i18n('noUndo'));}};
 document.getElementById('sk-tube').onclick=()=>{if(G.coins>=COST_TUBE){G.coins-=COST_TUBE;saveGame();addExtraTube();resumePlay();}else flash(i18n('noCoins')+' ('+COST_TUBE+'🪙)');};
 document.getElementById('sk-ad').onclick=()=>{flash('📺 ...');setTimeout(()=>{addExtraTube();resumePlay();},1500);};
 document.getElementById('sk-retry').onclick=()=>startLevel();

 if(G.phase==='over')return;G.phase='over';stopTimer();Audio.fail();
 const cr=!G.reviveUsed,hc=G.coins>=COST_TIME;
 showOv('rgba(14,3,3,0.94)','<div style="text-align:center;padding:22px 18px;max-width:310px;width:92%;"><div style="font-size:clamp(16px,5vw,30px);font-weight:900;color:#ff4466;margin-bottom:6px;">'+i18n(reason==='time'?'timesup':'nomoves')+'</div><div style="color:#662233;font-size:12px;margin-bottom:14px;">'+i18n('scoreDetail',{s:G.score,l:G.level,c:G.coins})+'</div>'
 +(cr?'<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">'
 +'<button id="rv-coins" class="btn" style="background:'+(hc?'linear-gradient(135deg,#f5a623,#e67e22)':'rgba(60,60,60,0.4)')+';font-size:12px;padding:10px;width:100%;min-height:44px;">'+i18n('timeCoins',{c:COST_TIME})+(hc?'':i18n('timeCoinsNo'))+'</button>'
 +'<button id="rv-tube" class="btn" style="background:rgba(77,208,255,0.12);border:1px solid rgba(77,208,255,0.3);font-size:12px;padding:10px;width:100%;min-height:44px;">🧪 '+COST_TUBE+' '+i18n('coins')+' → '+i18n('extratube')+'</button>'
 +'<button id="rv-ad" class="btn btn-primary" style="font-size:12px;padding:10px;width:100%;min-height:44px;">'+i18n('watchad')+'</button>'
 +'<button id="rv-share" class="btn btn-green" style="font-size:12px;padding:10px;width:100%;min-height:44px;">'+i18n('share')+'</button>'
 +'</div>':'')
 +'<button id="rv-retry" class="btn btn-ghost" style="font-size:13px;padding:10px 22px;min-height:44px;width:100%;">'+i18n('retry')+'</button></div>');
 document.getElementById('rv-retry').onclick=()=>startLevel();
 if(cr){
 document.getElementById('rv-coins').onclick=()=>{if(G.coins>=COST_TIME){G.coins-=COST_TIME;G.reviveUsed=true;G.timerLeft=Math.min(G.timerLeft+40,G.timerDur+40);saveGame();resumePlay();}else flash(i18n('noCoins')+' ('+COST_TIME+'🪙)');};
 document.getElementById('rv-tube').onclick=()=>{if(G.coins>=COST_TUBE){G.coins-=COST_TUBE;G.reviveUsed=true;saveGame();addExtraTube();resumePlay();}else flash(i18n('noCoins')+' ('+COST_TUBE+'🪙)');};
 document.getElementById('rv-ad').onclick=()=>{flash('📺 ...');setTimeout(()=>{addExtraTube();G.reviveUsed=true;resumePlay();},1500);};
 document.getElementById('rv-share').onclick=()=>{if(navigator.share){navigator.share({title:'Logic Tube Pro',text:i18n('sub'),url:location.href}).then(()=>{addExtraTube();G.reviveUsed=true;resumePlay();}).catch(()=>{addExtraTube();G.reviveUsed=true;resumePlay();});}else{try{navigator.clipboard.writeText(location.href);}catch{}flash('🔗 '+i18n('confirmShare'));setTimeout(()=>{addExtraTube();G.reviveUsed=true;resumePlay();},800);}};
 }
}

function doPause(){
 if(G.phase!=='playing')return;
 G.phase='paused';stopTimer();
 showOv('rgba(5,8,25,0.96)','<div style="text-align:center;padding:28px 20px;max-width:280px;width:90%;"><div style="font-size:26px;font-weight:900;color:#fff;margin-bottom:20px;">'+i18n('paused')+'</div><button id="ps-cont" class="btn btn-primary" style="width:100%;margin-bottom:10px;font-size:15px;">'+i18n('resume')+'</button><button id="ps-menu" class="btn btn-ghost" style="width:100%;font-size:13px;">'+i18n('mainMenu')+'</button></div>');
 document.getElementById('ps-cont').onclick=()=>{G.phase='playing';hideOv();startTimer();};
 document.getElementById('ps-menu').onclick=()=>{G.phase='splash';hideOv();showSplash();};
}

function resumePlay(){G.phase='playing';hideOv();G.timerLeft=G.timerDur;document.getElementById('hud').style.display='block';startTimer();updateHUD();}

function showLeaderboard(){
 const lb=getLB().slice(0,10),md=['🥇','🥈','🥉'];
 const rows=lb.length===0?'<div style="color:#223344;font-size:12px;padding:12px;">'+i18n('noLb')+'</div>':lb.map((e,i)=>'<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,0.04);margin-bottom:4px;"><span style="font-size:15px;width:22px;text-align:center;">'+(md[i]||(i+1)+'.')+'</span><span style="flex:1;color:#cce;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+e.name+'</span><span style="color:#ffd700;font-size:12px;font-weight:700;">'+e.score.toLocaleString()+'</span><span style="color:#88aaff;font-size:10px;">'+i18n('lvl')+' '+e.level+'</span></div>').join('');
 showOv('rgba(5,8,25,0.97)','<div style="text-align:center;padding:20px 16px;max-width:320px;width:94%;max-height:90vh;overflow-y:auto;"><div style="font-size:22px;font-weight:900;color:#ffd700;margin-bottom:12px;">'+i18n('lb')+'</div>'+rows+'<button id="lb-close" class="btn btn-ghost" style="margin-top:14px;font-size:13px;padding:10px 24px;min-height:44px;width:100%;">✕ '+i18n('close')+'</button></div>');
 document.getElementById('lb-close').onclick=()=>{hideOv();if(G.phase==='splash'||G.phase==='menu')showSplash();};
}

function startLevel(){
 G.phase='playing';G.reviveUsed=false;G.extraTubeUsed=false;G.selected=null;G.history=[];G.particles=[];G.hintTube=-1;
 const{tubes,palette}=genLevel(G.level);
 const{timer}=levelCfg(G.level);
 G.timerDur=timer;G.timerLeft=timer;G.palette=palette;
 G.tubes=tubes.map((tb,i)=>({blocks:[...tb.blocks],x:0,y:0,w:0,h:0,idx:i}));
 hideOv();document.getElementById('hud').style.display='block';
 layoutTubes();buildHUD();updateHUD();startTimer();saveGame();
}

function doMove(fi,ti){
 const from=G.tubes[fi],to=G.tubes[ti],top=from.blocks[from.blocks.length-1];
 if(from.blocks.length===BALLS&&from.blocks.every(b=>b===from.blocks[0])){G.selected=null;return;}
 let count=0;
 while(from.blocks.length>0&&from.blocks[from.blocks.length-1]===top&&to.blocks.length<BALLS){to.blocks.push(from.blocks.pop());count++;}
 G.history.push({fi,ti,count});Audio.place();G.selected=null;G.hintTube=-1;
 const tx=to.x+to.w/2,ty=to.y+to.h/2;
 if(to.blocks.length===BALLS&&to.blocks.every(b=>b===to.blocks[0])){
 Audio.tubeDone();spawnParticles(tx,ty,G.palette[to.blocks[0]]||'#fff');
 }
 updateHUD();
 if(isSolved(G.tubes)){setTimeout(()=>showWin(),500);return;}
 if(!hasAnyMove(G.tubes))setTimeout(()=>showStuck(),400);
}

function undoMove(){
 if(!G.history.length)return;
 const{fi,ti,count}=G.history.pop(),from=G.tubes[fi],to=G.tubes[ti];
 for(let i=0;i<count;i++)from.blocks.push(to.blocks.pop());
 Audio.pickup();updateHUD();
}

function addExtraTube(){
 if(G.extraTubeUsed)return;G.extraTubeUsed=true;
 G.tubes.push({blocks:[],x:0,y:0,w:0,h:0,idx:G.tubes.length});
 layoutTubes();
}

function handleTap(cx,cy){
 if(G.phase!=='playing')return;
 Audio.unlock();
 const idx=G.tubes.findIndex(tb=>{const lift=G.selected===tb.idx?-12:0;return cx>=tb.x&&cx<=tb.x+tb.w&&cy>=tb.y+lift&&cy<=tb.y+tb.h+lift;});
 if(idx===-1){G.selected=null;return;}
 const tb=G.tubes[idx];
 if(G.selected===null){if(tb.blocks.length===0){Audio.invalid();return;}G.selected=idx;Audio.pickup();}
 else if(G.selected===idx){G.selected=null;}
 else{const from=G.tubes[G.selected];if(canMove(from,tb))doMove(G.selected,idx);else{Audio.invalid();G.selected=null;if(tb.blocks.length>0){G.selected=idx;Audio.pickup();}}}
}

function startTimer(){stopTimer();G.timerHandle=setInterval(()=>{if(G.phase!=='playing')return;G.timerLeft=Math.max(0,G.timerLeft-1);updateHUD();if(G.timerLeft<=10)Audio.tick();if(G.timerLeft===0)showGameOver('time');},1000);}
function stopTimer(){if(G.timerHandle){clearInterval(G.timerHandle);G.timerHandle=null;}}

function saveGame(){lsSet(SAVE_KEY,{level:G.level,score:G.score,coins:G.coins,lang:LANG});}
function loadGame(){
 const d=lsGet(SAVE_KEY,null);
 if(d){G.level=d.level||1;G.score=d.score||0;G.coins=d.coins!==undefined?d.coins:50;if(d.lang&&LANGS[d.lang])LANG=d.lang;}
}

function calcSafe(){
 const el=document.createElement('div');
 el.style.cssText='position:fixed;top:env(safe-area-inset-top,0px);left:0;width:1px;height:1px;pointer-events:none;visibility:hidden;';
 document.body.appendChild(el);G.safeTop=el.getBoundingClientRect().top;el.remove();
 G.safeBottom=Math.max(0,window.screen.height-window.innerHeight>40?48:0);
}

function resize(){
 calcSafe();const dpr=Math.min(devicePixelRatio,2);
 G.W=window.innerWidth;G.H=window.innerHeight;
 G.canvas.width=G.W*dpr;G.canvas.height=G.H*dpr;
 G.ctx.setTransform(dpr,0,0,dpr,0,0);
 G.tubeY=Math.round(G.safeTop+115+8);
 if(G.tubes.length)layoutTubes();
}

function init(){
 LANG='en';
 loadGame();
 G.canvas=document.getElementById('cv');
 G.ctx=G.canvas.getContext('2d');
 resize();
 window.addEventListener('resize',resize);
 ['pointerdown','touchstart','mousedown'].forEach(ev=>{
 document.addEventListener(ev,function onFirst(){Audio.unlock();},{passive:true,once:true});
 });
 G.canvas.addEventListener('pointerdown',e=>handleTap(e.clientX,e.clientY));
 G.lastTime=performance.now();
 G.rafId=requestAnimationFrame(gameLoop);
 const dailyInfo=checkDailyReward();
 if(dailyInfo){setTimeout(()=>showDailyReward(),800);}else{showSplash();}
}

document.addEventListener('DOMContentLoaded',init);
</script>
